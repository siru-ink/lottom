[package]
name = "lottom"
version = "0.3.0"
edition = "2024"
description = "Self-hostable grocery list app."
readme = "readme.md"
homepage = "https://grocery.siru.ink/"
repository = "https://code.siru.ink/siru-ink/lottom"
license-file = "license.md"
keywords = ["webapp", "grocery"]
publish = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["form", "multipart"] }
base64 = "0.23.1"
chrono = "0.4.45"
infer = "0.22.0"
mime = "0.3.17"
mime_guess = "2.0.5"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
tera = { version = "2.1.1", features = ["fast", "glob_fs"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-cookies = { version="0.11.0", features = ["private"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
