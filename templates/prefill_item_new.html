{% extends '_base.html' %}

{% block title %}Create Prefill Item | {% endblock title %}

{% block content %}
<form action="/prefill/new" method="POST">
    <label for="en_name">English Name:</label>
    <input type="text" name="en_name" />
    <label for="zh_name">Chinese Name:</label>
    <input type="text" name="zh_name" />
    <label for="de_name">German Name:</label>

</form>
{% endblock content %}
