{% extends '_base.html' %}

{% block title %}List | {% endblock title %}

{% block content %}
<form >
    {% for item in items %}
    <div>
        <label for="checkbox-{{ item.id }}"></label>
        <input type="checkbox" name="{{ item.id }}" id="checkbox-{{ item.id }}" />
        <a href="/item?item_id={{ item.id }}">{{ item.en_name }}</a>
    </div>
    {% endfor %}
    <button>Bought</button>
</form>
{% endblock content %}
