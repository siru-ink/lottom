<style>
    :root {
        --background-color: white;
        --text-color: black;
        --text-color-offset: grey;
        --text-accent-color: #2C7761;
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        background-color: var(--background-color);
    }

    body .container {
        font-family: 'Times New Roman', Times, serif;
        max-width: 650px;
        margin: 0 auto;
    }

    form {
        border: 2px solid var(--text-color);
        padding: 0.5em 1em;
        box-shadow: 2px 2px var(--text-color);

        input {
            display: block;
            max-width: 250px;
            font-family: inherit;
            font-size: 1em;
            border-radius: 0;
            border: 1px solid var(--text-color);
            /*box-shadow: 1px 1px var(--text-color);*/
            padding: 0.3em 0.7em;

            &:focus-visible {
                outline: 2px solid var(--text-accent-color);
                /*border: 2px solid var(--text-accent-color);*/
                box-shadow: none;
            }
        }

        button {
            display: block;
            max-width: max-content;
            font-family: inherit;
            font-size: 1em;
            border-radius: 0;
            border: 1px solid var(--text-color);
            box-shadow: 2px 2px var(--text-color-offset);
            background-color: var(--text-color);
            color: var(--background-color);

            &:active {
                position: relative;
                top: 2px;
                left: 2px;
                box-shadow: none;
            }
        }
    }

    .flash_box {
        display: block;
        border: 2px solid var(--text-accent-color);
        color: var(--text-accent-color);
        box-shadow: 2px 2px var(--text-accent-color);
        padding: 0.4em 0.7em;
        margin-bottom: 1em;

        p {
            margin: 0
        }
    }
</style>
