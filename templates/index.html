{% extends '_base.html' %}

{% block title %}Home | {% endblock title %}

{% block content %}
<h2>Welcome back, {{ username }}!</h2>
<p>Would you like to look at one of your lists?</p>
{% for list in lists %}
<div class="link_box">
    <a href="/list?list_id={{ list.id }}">{{ list.name }}</a>
</div>
{% endfor %}
<div>
    <p><a href="/auth/logout">Alternatively, you could also log out?</a></p>
</div>
{% endblock content %}
